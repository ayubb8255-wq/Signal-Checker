<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal Checker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🚦 Traffic Signal</h1>

        <!-- Traffic Lights -->
        <div class="signal-box">
            <div class="light red" id="redLight"></div>
            <div class="light yellow" id="yellowLight"></div>
            <div class="light green" id="greenLight"></div>
        </div>

        <p class="subtitle">Choose or type a color</p>

        <!-- Input -->
        <input type="text" id="signalInput" placeholder="Enter red, yellow, green">

        <!-- Buttons -->
        <div class="btn-group">
            <button onclick="setSignal('red')">Red</button>
            <button onclick="setSignal('yellow')">Yellow</button>
            <button onclick="setSignal('green')">Green</button>
        </div>

        <button id="checkBtn">Check</button>
        <button id="resetBtn" class="reset">Reset</button>

        <p id="result"></p>

    </div>

    <script src="app.js"></script>
</body>
</html>
